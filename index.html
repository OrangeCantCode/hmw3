<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="hw3.css">
  <title>Patient Registration</title>
</head>
<body>
  <header>
    <table width="100%">
      <tr>
        <td valign="top" align="left" width="20%">
          <div class="logo">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDEwMCAxMDAiPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjUwIiBmaWxsPSIjNTZBQjJGIi8+PHJlY3QgeD0iNDUiIHk9IjIwIiB3aWR0aD0iMTAiIGhlaWdodD0iNjAiIGZpbGw9IiNmZmYiLz48cmVjdCB4PSIyMCIgeT0iNDUiIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMCIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==" alt="Simple Medical Logo" width="80" height="80" id="siteLogo">
          </div>
        </td>
        <td>
          <h2>Arnav's Hospital Center</h2>
        </td>
        <td valign="bottom" align="right" width="20%">
          <p>Date: <span id="currentDate"></span></p>
        </td>
      </tr>
    </table>
  </header>
  <hr>
  <form action="thankyou.html" id="signup">
    <div class="form-wrapper">
      <table>
        <tr>
          <th colspan="4">Create Account</th>
        </tr>
        <tr>
          <td><label for="fname">First Name:</label></td>
          <td>
            <input type="text" name="fname" id="fname" minlength="1" maxlength="30" required placeholder="arnav" title="Letters, apostrophes, and dashes only" pattern="[a-zA-Z'-]{1,30}" onblur="validateFname()">
            <span class="error" id="fname-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="mini">Middle Initial:</label></td>
          <td>
            <input type="text" name="mini" id="mini" maxlength="1" placeholder="A" title="Letters only" pattern="[a-zA-Z']{0,1}" onblur="validateMini()">
            <span class="error" id="mini-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="lname">Last Name:</label></td>
          <td>
            <input type="text" name="lname" id="lname" minlength="1" maxlength="30" required placeholder="gupta" title="Letters, apostrophes, and dashes only" pattern="[a-zA-Z'-]{1,30}" onblur="validateLname()">
            <span class="error" id="lname-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="gender">Gender:</label></td>
          <td>
            <input type="radio" id="male" name="gender" value="Male"> Male
            <input type="radio" id="female" name="gender" value="Female"> Female
            <input type="radio" id="other" name="gender" value="Other"> Other
          </td>
        </tr>
        <tr>
          <td><label for="dob">Date of Birth:</label></td>
          <td>
            <input type="date" id="dob" name="dob" required onblur="validateDob()">
            <span class="error" id="dob-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="address1">Address 1:</label></td>
          <td>
            <input type="text" name="address1" id="address1" minlength="2" maxlength="30" required placeholder="O Block" title="Please enter your address" onblur="validateAddress1()">
            <span class="error" id="address1-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="address2">Address 2:</label></td>
          <td>
            <input type="text" name="address2" id="address2" maxlength="40" placeholder="Apartment/Unit">
          </td>
        </tr>
        <tr>
          <td><label for="city">City:</label></td>
          <td>
            <input type="text" name="city" id="city" maxlength="30" required placeholder="City">
            <span class="error" id="city-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="state">State:</label></td>
          <td>
            <select id="state" name="state" required>
              <option disabled selected value="">Select One</option>
              <option value="TX">Texas</option>
              <option value="CA">California</option>
              <option value="NY">New York</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="zcode">Zip Code:</label></td>
          <td>
            <input type="text" name="zcode" id="zcode" maxlength="10" required placeholder="12345" title="Numbers and a dash only" pattern="^\d{5}(-\d{4})?$" onblur="validateZcode()">
            <span class="error" id="zcode-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="email">Email:</label></td>
          <td>
            <input type="email" name="email" id="email" required placeholder="user@example.com" title="Enter a valid email address" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,20}$" onblur="validateEmail()">
            <span class="error" id="email-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="phone">Phone:</label></td>
          <td>
            <input type="tel" name="phone" id="phone" required placeholder="000-000-0000" title="Format: 000-000-0000" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" onblur="validatePhone()">
            <span class="error" id="phone-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="history">Past Conditions:</label></td>
          <td>
            <input type="checkbox" id="check1" name="history" value="Chicken Pox">Chicken Pox
            <input type="checkbox" id="check2" name="history" value="Measles">Measles
            <input type="checkbox" id="check3" name="history" value="Flu">Flu
          </td>
        </tr>
        <tr>
          <td><label for="notes">Notes:</label></td>
          <td>
            <textarea id="notes" name="notes" rows="4" cols="35" placeholder="Additional info..."></textarea>
          </td>
        </tr>
        <tr>
          <td><label for="healthRange">Health (1-10):</label></td>
          <td>
            <input type="range" name="healthRange" id="healthRange" min="1" max="10" value="5">
            <span id="healthValue"></span>
          </td>
        </tr>
        <tr>
          <td><label for="uid">Username:</label></td>
          <td>
            <input type="text" name="uid" id="uid" maxlength="20" required placeholder="Create a username" title="User ID must be 5-30 characters, start with a letter, and include only letters, numbers, underscores, or dashes" onblur="validateUid()">
            <span class="error" id="uid-error"></span>
          </td>
        </tr>
        <tr>
          <td><label for="pword">Password:</label></td>
          <td>
            <input type="password" name="pword" id="pword" minlength="10" required title="At least 10 characters including one uppercase letter, one number, and one special character" onblur="validatePword()" oninput="validatePword()" onfocus="validatePword()">
          </td>
        </tr>
        <tr>
          <td><label for="con_pword">Confirm Password:</label></td>
          <td>
            <input type="password" name="con_pword" id="con_pword" minlength="10" required placeholder="Re-enter password" onblur="confirmPword()" oninput="confirmPword()" onfocus="confirmPword()">
            <span class="error" id="pword2-error"></span>
          </td>
        </tr>
        <tr>
          <td colspan="4" align="center">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <input type="button" name="validate" id="validate" value="Validate" style="font-family: pick a font;" onclick="validateEverything()">
            <input type="button" name="review" id="review" value="Review" onclick="reviewInput()">
          </td>
        </tr>
      </table>
      <div class="pword-message">
        <span id="msg1"></span><br/>
        <span id="msg2"></span><br/>
        <span id="msg3"></span><br/>
        <span id="msg4"></span><br/>
      </div>
      <center>
        <p id="showInput"></p>
      </center>
    </div>
  </form>
  <div id="alert-box">
    <div id="alert-content">
      <h4>Please fill out all required fields or any other message you want</h4>
      <button id="close-alert">OK</button>
    </div>
  </div>
  <footer>
    <p>&#169; 2025 Arnav's Hospital Center <a href="contact.html">Contact Us</a></p>
  </footer>
  <script src="hw3.js"></script>
</body>
</html>
